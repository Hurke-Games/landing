<!doctype html>
<html lang="en" class="scroll-smooth bg-neutral-950 text-neutral-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hurke Games | Indie Web Games Studio</title>
    <meta name="description" content="Explore browser-based indie games by Hurke Games including Mr. Mayor, Zombie Survivor, Tank Wars, Fleet Command, Poop Fly, and Galactic Clash." />
    <meta property="og:title" content="Hurke Games | Indie Web Games Studio" />
    <meta property="og:description" content="Explore browser-based indie games by Hurke Games including Mr. Mayor, Zombie Survivor, Tank Wars, Fleet Command, Poop Fly, and Galactic Clash." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body class="min-h-screen bg-neutral-950 text-neutral-100 antialiased selection:bg-amber-500/20 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      setTimeout(() => {
        const root = document.getElementById('root');
        if (root && root.children.length === 0) {
          const l = document.createElement('link');
          l.rel = 'stylesheet';
          l.crossOrigin = 'anonymous';
          l.href = '/landing/assets/index.css';
          document.head.appendChild(l);

          const s = document.createElement('script');
          s.type = 'module';
          s.crossOrigin = 'anonymous';
          s.src = '/landing/assets/index.js';
          document.body.appendChild(s);
        }
      }, 50);
    </script>
  </body>
</html>
