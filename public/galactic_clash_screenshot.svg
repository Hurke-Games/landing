<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="0.8" fill="rgba(255, 255, 255, 0.15)" />
    </pattern>

    <!-- Radar glow -->
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.8" />
    </radialGradient>

    <!-- Planet gradient -->
    <radialGradient id="planetGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="60%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Hull bar glow -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="radarSweepGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', monospace; }
    .heading { font-family: 'Outfit', -apple-system, sans-serif; font-weight: 700; }
    .sans { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  </style>

  <!-- Deep space background -->
  <rect width="1200" height="500" fill="#040810" />
  <rect width="1200" height="500" fill="url(#grid)" />

  <!-- Orbit line -->
  <ellipse cx="600" cy="290" rx="340" ry="160" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-dasharray="4,6" />
  <ellipse cx="600" cy="290" rx="420" ry="200" fill="none" stroke="rgba(255, 255, 255, 0.05)" />

  <!-- ================= TOP HUD BAR ================= -->
  <rect x="16" y="16" width="1168" height="64" rx="14" fill="#0b1322" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2" />

  <!-- Logo and mode -->
  <text x="36" y="44" fill="#ffffff" class="heading" font-size="20" letter-spacing="-0.5">Galactic</text>
  <text x="36" y="64" fill="#ffffff" class="heading" font-size="20" letter-spacing="-0.5">Clash</text>

  <text x="145" y="47" fill="#64748b" class="sans" font-size="11" font-weight="500">Tactical Space</text>
  <text x="145" y="61" fill="#64748b" class="sans" font-size="11" font-weight="500">Dominion</text>

  <!-- Factions Dominions -->
  <!-- Terran Vanguard -->
  <circle cx="258" cy="48" r="5" fill="#38bdf8" />
  <text x="270" y="52" fill="#cbd5e1" class="sans" font-size="12">Terran Vanguard:</text>
  <text x="382" y="52" fill="#ffffff" class="heading" font-size="14">1</text>

  <!-- Crimson Syndicate -->
  <circle cx="414" cy="48" r="5" fill="#f43f5e" />
  <text x="426" y="52" fill="#cbd5e1" class="sans" font-size="12">Crimson Syndicate:</text>
  <text x="548" y="52" fill="#ffffff" class="heading" font-size="14">6</text>

  <!-- Verdant Dominion -->
  <circle cx="580" cy="48" r="5" fill="#22c55e" />
  <text x="592" y="52" fill="#cbd5e1" class="sans" font-size="12">Verdant Dominion:</text>
  <text x="702" y="52" fill="#ffffff" class="heading" font-size="14">4</text>

  <!-- Void Enclave -->
  <circle cx="734" cy="48" r="5" fill="#a855f7" />
  <text x="746" y="52" fill="#cbd5e1" class="sans" font-size="12">Void Enclave:</text>
  <text x="836" y="52" fill="#ffffff" class="heading" font-size="14">3</text>

  <!-- Unoccupied -->
  <circle cx="868" cy="48" r="5" fill="#64748b" />
  <text x="880" y="52" fill="#94a3b8" class="sans" font-size="12">Unoccupied: 6</text>

  <!-- Right HUD Controls -->
  <!-- Settings Button -->
  <rect x="990" y="32" width="86" height="32" rx="8" fill="#0f1f38" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
  <text x="1024" y="52" fill="#38bdf8" class="sans" font-size="12" font-weight="600">Settings</text>
  <circle cx="1010" cy="48" r="4" fill="none" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Mute Button -->
  <rect x="1084" y="32" width="34" height="32" rx="8" fill="#1e1b2e" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1" />
  <path d="M1097 45 L1103 41 L1103 55 L1097 51 Z" fill="#f43f5e" />

  <!-- Pause Button -->
  <rect x="1126" y="32" width="22" height="32" rx="6" fill="#0f1f38" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />
  <rect x="1132" y="42" width="3" height="12" fill="#94a3b8" />
  <rect x="1139" y="42" width="3" height="12" fill="#94a3b8" />

  <!-- New Game Button -->
  <rect x="1156" y="32" width="20" height="32" rx="6" fill="#0284c7" />

  <!-- ================= CENTER PLANET & SHIP (Capella 1) ================= -->
  <g transform="translate(600, 275)">
    <!-- Planet Atmosphere glow -->
    <circle cx="0" cy="0" r="58" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="64" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3,5" stroke-opacity="0.25" />

    <!-- Planet Body -->
    <circle cx="0" cy="0" r="52" fill="url(#planetGrad)" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Craters -->
    <circle cx="-16" cy="-10" r="10" fill="#1e293b" opacity="0.6" />
    <circle cx="-10" cy="18" r="14" fill="#1e293b" opacity="0.7" />
    <circle cx="18" cy="4" r="8" fill="#1e293b" opacity="0.5" />

    <!-- Docked ship indicator -->
    <g transform="translate(18, -48)">
      <path d="M0 -8 L8 12 L0 8 L-8 12 Z" fill="#38bdf8" />
      <circle cx="0" cy="2" r="12" fill="none" stroke="#38bdf8" stroke-width="1.2" />
    </g>

    <!-- Colony ship alongside -->
    <g transform="translate(58, -12)">
      <rect x="0" y="-14" width="16" height="30" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
      <text x="22" y="-4" fill="#38bdf8" class="mono" font-size="8" font-weight="600">COLONY ARK</text>
    </g>

    <!-- Docked tag -->
    <text x="0" y="-62" fill="#38bdf8" class="sans" font-size="10" font-weight="600" text-anchor="middle">
      Terran Vanguard [LANDED] ⚡ 2X
    </text>

    <!-- Planet label -->
    <text x="0" y="74" fill="#38bdf8" class="heading" font-size="12" text-anchor="middle">Capella 1</text>

    <!-- In-game Instruction Banner -->
    <text x="0" y="102" fill="#38bdf8" class="mono" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">
      PRESS [W] OR [↑] OR [SHIFT] TO BLAST OFF INTO SPACE
    </text>
  </g>

  <!-- ================= BOTTOM LEFT HUD (SHIP STATUS) ================= -->
  <g transform="translate(24, 385)">
    <!-- Container background -->
    <rect width="480" height="98" rx="12" fill="#07101e" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />

    <!-- Hull title -->
    <path d="M28 24 L28 40 L36 44 L44 40 L44 24 Z" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <text x="64" y="28" fill="#64748b" class="mono" font-size="9" font-weight="600">SHIP HULL</text>
    <text x="64" y="44" fill="#ffffff" class="heading" font-size="15">5 / 5 HP</text>

    <!-- Hull bars -->
    <g transform="translate(130, 22)">
      <rect x="0" y="0" width="12" height="24" rx="2" fill="#00e5ff" filter="url(#cyanGlow)" />
      <rect x="16" y="0" width="12" height="24" rx="2" fill="#00e5ff" filter="url(#cyanGlow)" />
      <rect x="32" y="0" width="12" height="24" rx="2" fill="#00e5ff" filter="url(#cyanGlow)" />
      <rect x="48" y="0" width="12" height="24" rx="2" fill="#00e5ff" filter="url(#cyanGlow)" />
      <rect x="64" y="0" width="12" height="24" rx="2" fill="#00e5ff" filter="url(#cyanGlow)" />
    </g>

    <!-- Thrust Boost -->
    <g transform="translate(240, 20)">
      <rect x="0" y="6" width="24" height="24" rx="6" fill="#1e1808" stroke="#f59e0b" stroke-width="1" />
      <path d="M12 10 L15 16 L12 18 L16 26 L9 18 L12 16 Z" fill="#f59e0b" />
      <text x="32" y="16" fill="#94a3b8" class="mono" font-size="9">THRUST BOOST</text>
      <rect x="110" y="6" width="56" height="15" rx="3" fill="#2d2208" stroke="#f59e0b" stroke-width="0.8" />
      <text x="116" y="17" fill="#fbbf24" class="mono" font-size="9" font-weight="700">SHIFT · 2X</text>

      <!-- Gauge bar -->
      <rect x="32" y="24" width="100" height="7" rx="3.5" fill="#1e293b" />
      <rect x="32" y="24" width="100" height="7" rx="3.5" fill="#f59e0b" />
      <text x="140" y="31" fill="#ffffff" class="mono" font-size="9">100%</text>
    </g>

    <!-- Shield and badges -->
    <g transform="translate(390, 14)">
      <rect x="0" y="0" width="80" height="38" rx="8" fill="#081e35" stroke="#38bdf8" stroke-width="1" />
      <text x="40" y="15" fill="#38bdf8" class="mono" font-size="8" text-anchor="middle">SHIELD</text>
      <text x="40" y="30" fill="#ffffff" class="mono" font-size="11" font-weight="700" text-anchor="middle">25/25 HP</text>

      <rect x="0" y="44" width="80" height="24" rx="6" fill="#2b1b08" stroke="#f59e0b" stroke-width="1" />
      <text x="40" y="60" fill="#fbbf24" class="mono" font-size="10" font-weight="700" text-anchor="middle">⚡ 2X DMG</text>
    </g>
  </g>

  <!-- ================= BOTTOM CENTER KEYBINDINGS ================= -->
  <g transform="translate(520, 395)">
    <rect width="280" height="88" rx="10" fill="#060c18" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1" />

    <!-- Thrust key -->
    <g transform="translate(14, 14)">
      <rect x="0" y="0" width="34" height="60" rx="6" fill="#0b1b30" stroke="#38bdf8" stroke-width="1" />
      <text x="17" y="16" fill="#38bdf8" class="mono" font-size="9" text-anchor="middle" font-weight="700">W</text>
      <text x="17" y="26" fill="#64748b" class="mono" font-size="8" text-anchor="middle">/</text>
      <text x="17" y="36" fill="#38bdf8" class="mono" font-size="9" text-anchor="middle">↑</text>
      <text x="17" y="46" fill="#64748b" class="mono" font-size="8" text-anchor="middle">/</text>
      <text x="17" y="56" fill="#38bdf8" class="mono" font-size="7" text-anchor="middle">SHIFT</text>
      <text x="44" y="38" fill="#94a3b8" class="sans" font-size="11">Thrust</text>
    </g>

    <!-- Boost key -->
    <g transform="translate(100, 30)">
      <rect x="0" y="0" width="42" height="22" rx="4" fill="#291e0a" stroke="#f59e0b" stroke-width="1" />
      <text x="21" y="15" fill="#fbbf24" class="mono" font-size="9" text-anchor="middle" font-weight="700">SHIFT</text>
      <text x="48" y="15" fill="#94a3b8" class="sans" font-size="10">2x Boost</text>
    </g>

    <!-- Land key -->
    <g transform="translate(180, 14)">
      <rect x="0" y="0" width="26" height="60" rx="6" fill="#0b1b30" stroke="#38bdf8" stroke-width="1" />
      <text x="13" y="16" fill="#38bdf8" class="mono" font-size="9" text-anchor="middle" font-weight="700">S</text>
      <text x="13" y="26" fill="#64748b" class="mono" font-size="8" text-anchor="middle">/</text>
      <text x="13" y="36" fill="#38bdf8" class="mono" font-size="9" text-anchor="middle">↓</text>
      <text x="13" y="46" fill="#64748b" class="mono" font-size="8" text-anchor="middle">/</text>
      <text x="13" y="56" fill="#38bdf8" class="mono" font-size="9" text-anchor="middle">L</text>
      <text x="34" y="38" fill="#94a3b8" class="sans" font-size="11">Land</text>
    </g>
  </g>

  <!-- ================= BOTTOM RIGHT GALAXY RADAR ================= -->
  <g transform="translate(940, 240)">
    <!-- Radar container -->
    <rect width="235" height="245" rx="14" fill="#050a14" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />

    <!-- Radar header -->
    <circle cx="24" cy="24" r="4" fill="#22c55e" />
    <text x="36" y="28" fill="#ffffff" class="mono" font-size="11" font-weight="700" letter-spacing="0.5">GALAXY RADAR</text>
    <text x="170" y="28" fill="#38bdf8" class="mono" font-size="9">LIVE TRACKING</text>

    <!-- Radar scope -->
    <g transform="translate(117, 138)">
      <!-- Radar background circle -->
      <circle cx="0" cy="0" r="92" fill="url(#radarGlow)" stroke="#0284c7" stroke-width="1.2" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="62" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-dasharray="2,3" stroke-opacity="0.3" />
      <circle cx="0" cy="0" r="32" fill="none" stroke="#0284c7" stroke-width="0.8" stroke-opacity="0.3" />

      <!-- Crosshairs -->
      <line x1="-92" y1="0" x2="92" y2="0" stroke="#0284c7" stroke-width="0.6" stroke-opacity="0.35" />
      <line x1="0" y1="-92" x2="0" y2="92" stroke="#0284c7" stroke-width="0.6" stroke-opacity="0.35" />

      <!-- Sweeping line -->
      <line x1="0" y1="0" x2="65" y2="-65" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.8" filter="url(#radarSweepGlow)" />
      <path d="M0 0 L65 -65 A 92 92 0 0 0 10 -91 Z" fill="#22c55e" fill-opacity="0.12" />

      <!-- Radar Blips from user screenshot -->
      <!-- Red / Crimson Syndicate blips -->
      <circle cx="-10" cy="-60" r="4" fill="#f43f5e" />
      <circle cx="-25" cy="-42" r="3.5" fill="#f43f5e" />
      <circle cx="-28" cy="-28" r="3" fill="#f43f5e" />
      <circle cx="-15" cy="-20" r="3" fill="#f43f5e" />
      <circle cx="-35" cy="-5" r="3.5" fill="#f43f5e" />

      <!-- Yellow Capella star blips -->
      <polygon points="-8,-38 0,-44 8,-38 2,-30 -8,-38" fill="#fbbf24" />
      <polygon points="12,-20 18,-24 24,-20 20,-14 12,-20" fill="#fbbf24" />
      <polygon points="40,-4 46,-8 52,-4 48,2 40,-4" fill="#fbbf24" />

      <!-- Purple / Void Enclave blips -->
      <circle cx="45" cy="20" r="3.5" fill="#a855f7" />
      <circle cx="38" cy="32" r="3" fill="#a855f7" />

      <!-- Green / Verdant Dominion blip -->
      <circle cx="-12" cy="38" r="3.5" fill="#22c55e" />

      <!-- Cyan / Terran Vanguard (Player fleet) -->
      <circle cx="-16" cy="50" r="4" fill="#38bdf8" />
      <circle cx="-16" cy="50" r="8" fill="none" stroke="#38bdf8" stroke-width="1" />
      <circle cx="-6" cy="58" r="3" fill="#38bdf8" />
    </g>
  </g>
</svg>
