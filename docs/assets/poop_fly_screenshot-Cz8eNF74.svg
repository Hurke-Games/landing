<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%">
  <defs>
    <!-- Sky gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="60%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Sun glow -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#ecfccb" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#bae6fd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <!-- Lamp glow halo -->
    <radialGradient id="lampHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#bfdbfe" stop-opacity="0.5" />
      <stop offset="85%" stop-color="#60a5fa" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>

    <!-- Clapboard siding pattern -->
    <pattern id="clapboard" width="100" height="18" patternUnits="userSpaceOnUse">
      <line x1="0" y1="18" x2="100" y2="18" stroke="#cbd5e1" stroke-width="1.2" />
    </pattern>
  </defs>

  <style>
    .font-game { font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif; font-weight: 700; }
    .font-hud { font-family: 'JetBrains Mono', monospace; font-weight: 800; }
  </style>

  <!-- ================= 1. SKY & SUN ================= -->
  <rect width="1200" height="560" fill="url(#skyGrad)" />

  <!-- Subtle atmospheric dust/spores -->
  <circle cx="120" cy="80" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="280" cy="140" r="1.2" fill="#ffffff" opacity="0.5" />
  <circle cx="450" cy="100" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="580" cy="160" r="1.2" fill="#ffffff" opacity="0.5" />
  <circle cx="700" cy="90" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="830" cy="220" r="1.2" fill="#ffffff" opacity="0.5" />
  <circle cx="340" cy="280" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="670" cy="320" r="1.2" fill="#ffffff" opacity="0.5" />

  <!-- Glowing Sun rings (top right) -->
  <g transform="translate(980, 20)">
    <circle cx="0" cy="0" r="130" fill="url(#sunGlow)" />
    <circle cx="0" cy="0" r="75" fill="#ffffff" opacity="0.3" />
    <circle cx="0" cy="0" r="45" fill="#ffffff" opacity="0.8" />
    <circle cx="0" cy="0" r="32" fill="#ffffff" />
  </g>

  <!-- ================= 2. FLYING PREDATOR BIRD (top) ================= -->
  <g transform="translate(805, 62)">
    <!-- Bird body -->
    <ellipse cx="0" cy="0" rx="20" ry="11" fill="#64748b" />
    <ellipse cx="3" cy="2" rx="14" ry="7" fill="#475569" />
    <!-- Yellow belly stripes -->
    <line x1="-8" y1="5" x2="-8" y2="10" stroke="#f59e0b" stroke-width="2" />
    <line x1="-3" y1="5" x2="-3" y2="11" stroke="#f59e0b" stroke-width="2" />
    <line x1="2" y1="5" x2="2" y2="10" stroke="#f59e0b" stroke-width="2" />
    <!-- Beak -->
    <polygon points="-20,-2 -28,1 -20,4" fill="#f59e0b" />
    <!-- Eye -->
    <circle cx="-13" cy="-2" r="3" fill="#ffffff" />
    <circle cx="-14" cy="-2" r="1.5" fill="#0f172a" />
    <!-- Wing -->
    <path d="M-6 -2 Q 4 -14, 14 -8 Q 6 -2, -6 -2 Z" fill="#334155" />
    <!-- Tail feathers -->
    <polygon points="18,-4 26,-7 23,0" fill="#334155" />
    <polygon points="18,0 27,2 20,5" fill="#334155" />
  </g>

  <!-- ================= 3. ROLLING HILLS (background) ================= -->
  <path d="M0 455 Q 350 435, 750 455 T 1200 450 L 1200 560 L 0 560 Z" fill="#6ea672" />
  <path d="M0 475 Q 400 460, 850 475 T 1200 470 L 1200 560 L 0 560 Z" fill="#81b885" />

  <!-- ================= 4. SUBURBAN HOUSE (right side) ================= -->
  <g transform="translate(870, 90)">
    <!-- Pitched Roof -->
    <polygon points="155,0 -15,110 325,110" fill="#b91c1c" />
    <polygon points="155,5 -6,110 316,110" fill="#991b1b" opacity="0.6" />

    <!-- Main Building facade -->
    <rect x="0" y="110" width="310" height="420" fill="#f1f5f9" />
    <rect x="0" y="110" width="310" height="420" fill="url(#clapboard)" />

    <!-- Upstairs Window Left (Yellow illuminated) -->
    <rect x="32" y="165" width="54" height="60" rx="3" fill="#fef08a" stroke="#cbd5e1" stroke-width="2" />
    <line x1="59" y1="165" x2="59" y2="225" stroke="#ffffff" stroke-width="3" />
    <line x1="32" y1="195" x2="86" y2="195" stroke="#ffffff" stroke-width="3" />

    <!-- Upstairs Window Right (Open with breeze/screen) -->
    <rect x="185" y="165" width="58" height="62" rx="3" fill="#334155" stroke="#fef08a" stroke-width="3" />
    <rect x="190" y="170" width="48" height="52" fill="#0f172a" />
    <!-- Open shutter pane frame -->
    <polygon points="243,165 254,175 254,235 243,227" fill="#ffffff" opacity="0.8" stroke="#cbd5e1" />

    <!-- "UPSTAIRS BEDROOM" Navigation Indicator badge -->
    <g transform="translate(164, 142)">
      <rect x="0" y="0" width="118" height="20" rx="4" fill="#090d16" stroke="#fbbf24" stroke-width="1.2" />
      <polygon points="10,6 15,10 10,14" fill="#fbbf24" />
      <text x="20" y="14" fill="#fbbf24" class="font-hud" font-size="9" letter-spacing="0.5">UPSTAIRS BEDROOM</text>
    </g>

    <!-- Front Door on Ground Floor -->
    <rect x="120" y="445" width="44" height="85" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <!-- Doorknob -->
    <circle cx="156" cy="488" r="3.5" fill="#fbbf24" />

    <!-- Door mat -->
    <rect x="105" y="528" width="75" height="6" rx="2" fill="#1e293b" />
    <line x1="110" y1="528" x2="110" y2="534" stroke="#475569" stroke-width="2" />
    <line x1="120" y1="528" x2="120" y2="534" stroke="#475569" stroke-width="2" />
    <line x1="130" y1="528" x2="130" y2="534" stroke="#475569" stroke-width="2" />
    <line x1="140" y1="528" x2="140" y2="534" stroke="#475569" stroke-width="2" />
    <line x1="150" y1="528" x2="150" y2="534" stroke="#475569" stroke-width="2" />
    <line x1="160" y1="528" x2="160" y2="534" stroke="#475569" stroke-width="2" />
    <line x1="170" y1="528" x2="170" y2="534" stroke="#475569" stroke-width="2" />
  </g>

  <!-- ================= 5. TREE (left side) ================= -->
  <g transform="translate(195, 340)">
    <!-- Tree Trunk -->
    <rect x="-16" y="40" width="32" height="150" fill="#78350f" />

    <!-- Lush Round Foliage layers -->
    <!-- Base large circle -->
    <circle cx="0" cy="0" r="95" fill="#10b981" />
    <!-- Overlap circles for depth -->
    <circle cx="-35" cy="-10" r="60" fill="#22c55e" />
    <circle cx="30" cy="-20" r="55" fill="#34d399" />
    <circle cx="0" cy="-35" r="50" fill="#4ade80" />
    <!-- Inner bright canopy highlight -->
    <circle cx="8" cy="-5" r="70" fill="#22c55e" />
  </g>

  <!-- ================= 6. SIDEWALK & CURB (foreground) ================= -->
  <rect x="0" y="525" width="1200" height="35" fill="#cbd5e1" />
  <line x1="0" y1="525" x2="1200" y2="525" stroke="#94a3b8" stroke-width="3" />

  <!-- Sidewalk expansion seams -->
  <line x1="122" y1="525" x2="122" y2="560" stroke="#64748b" stroke-width="2" />
  <line x1="270" y1="525" x2="270" y2="560" stroke="#64748b" stroke-width="2" />
  <line x1="515" y1="525" x2="515" y2="560" stroke="#64748b" stroke-width="2" />
  <line x1="710" y1="525" x2="710" y2="560" stroke="#64748b" stroke-width="2" />
  <line x1="1105" y1="525" x2="1105" y2="560" stroke="#64748b" stroke-width="2" />

  <!-- ================= 7. GROUND OBSTACLES: RAT & FIRE HYDRANT ================= -->
  <!-- Ground Rat -->
  <g transform="translate(290, 508)">
    <!-- Pink Tail -->
    <path d="M22 6 Q 50 -2, 65 -8" fill="none" stroke="#fca5a5" stroke-width="2.5" stroke-linecap="round" />
    <!-- Body -->
    <ellipse cx="0" cy="5" rx="24" ry="12" fill="#64748b" />
    <ellipse cx="-16" cy="5" rx="10" ry="7" fill="#64748b" />
    <!-- Snout & Whiskers -->
    <polygon points="-24,4 -32,7 -24,8" fill="#fda4af" />
    <line x1="-28" y1="6" x2="-36" y2="3" stroke="#cbd5e1" stroke-width="1" />
    <line x1="-28" y1="7" x2="-36" y2="10" stroke="#cbd5e1" stroke-width="1" />
    <!-- Glowing Red Eye -->
    <circle cx="-18" cy="3" r="2.5" fill="#ef4444" />
    <!-- Pink Ear -->
    <circle cx="-10" cy="-1" r="3.5" fill="#fca5a5" />
    <!-- Paws -->
    <ellipse cx="-12" cy="17" rx="4" ry="2" fill="#fda4af" />
    <ellipse cx="12" cy="17" rx="4" ry="2" fill="#fda4af" />
  </g>

  <!-- Red Fire Hydrant -->
  <g transform="translate(398, 480)">
    <!-- Base plate -->
    <rect x="-28" y="44" width="56" height="10" fill="#b91c1c" />
    <!-- Lower barrel -->
    <rect x="-24" y="18" width="48" height="26" fill="#dc2626" />
    <!-- Side nozzles -->
    <rect x="-33" y="24" width="9" height="12" fill="#991b1b" />
    <circle cx="-33" cy="30" r="4" fill="#fbbf24" />
    <rect x="24" y="24" width="9" height="12" fill="#991b1b" />
    <circle cx="33" cy="30" r="4" fill="#fbbf24" />
    <!-- Main bonnet / dome -->
    <ellipse cx="0" cy="18" rx="24" ry="7" fill="#ef4444" />
    <path d="M-18 18 Q 0 0, 18 18 Z" fill="#dc2626" />
    <!-- Top hex nut -->
    <polygon points="-5,2 0,-3 5,2 5,6 0,8 -5,6" fill="#fbbf24" />
  </g>

  <!-- ================= 8. STREET LIGHT POLE & SURVIVAL SANDWICH ================= -->
  <g transform="translate(630, 260)">
    <!-- Light halo / aura (soft glowing blue oval) -->
    <ellipse cx="-60" cy="30" rx="60" ry="34" fill="url(#lampHalo)" opacity="0.85" />

    <!-- Street pole body -->
    <!-- Base mounting on sidewalk -->
    <rect x="-18" y="270" width="36" height="14" rx="3" fill="#1e293b" />
    <!-- Vertical post -->
    <rect x="-8" y="0" width="16" height="270" fill="#334155" />
    <!-- Top horizontal arm -->
    <path d="M-8 0 L-85 0 L-85 30 L-65 30 L-65 14 L-8 14 Z" fill="#334155" />
    <!-- Lamp head lantern -->
    <rect x="-80" y="30" width="30" height="10" rx="2" fill="#1e293b" />
    <ellipse cx="-65" cy="40" rx="12" ry="7" fill="#fef08a" />

    <!-- FOOD ITEM: The Sub Sandwich sitting on lamp bracket -->
    <g transform="translate(-7, 36)">
      <!-- Plant sprig on post -->
      <path d="M0 0 Q 3 -8, 8 -6" fill="none" stroke="#22c55e" stroke-width="2" />
      <path d="M0 2 Q 5 2, 7 -2" fill="none" stroke="#22c55e" stroke-width="2" />
      
      <!-- Top bun -->
      <path d="M-14 4 Q 0 -4, 14 4 Z" fill="#d97706" />
      <!-- Lettuce -->
      <rect x="-15" y="4" width="30" height="3" rx="1.5" fill="#22c55e" />
      <!-- Tomato / Ham -->
      <rect x="-13" y="7" width="26" height="3" rx="1" fill="#ef4444" />
      <!-- Cheese -->
      <polygon points="-12,10 0,13 12,10" fill="#fbbf24" />
      <!-- Bottom bun -->
      <path d="M-14 10 L14 10 Q 0 16, -14 10 Z" fill="#b45309" />
    </g>

    <!-- "+10 SURVIVAL" Text Overlay -->
    <text x="-70" y="44" fill="#38bdf8" class="font-hud" font-size="15" text-anchor="middle" letter-spacing="-0.3">
      +10 SURVIVAL
    </text>
  </g>

  <!-- ================= 9. THE HERO: THE FLY (center) ================= -->
  <g transform="translate(568, 388)">
    <!-- Wings (translucent vibrating flight wings) -->
    <!-- Left wing -->
    <ellipse cx="-12" cy="-1" rx="10" ry="5" fill="#e0f2fe" opacity="0.75" transform="rotate(-15 -12 -1)" stroke="#38bdf8" stroke-width="0.8" />
    <!-- Right wing -->
    <ellipse cx="12" cy="-1" rx="10" ry="5" fill="#e0f2fe" opacity="0.75" transform="rotate(15 12 -1)" stroke="#38bdf8" stroke-width="0.8" />

    <!-- Fly Body (Black thorax & abdomen) -->
    <ellipse cx="0" cy="0" rx="9" ry="8" fill="#0f172a" />
    <ellipse cx="0" cy="3" rx="7" ry="6" fill="#1e293b" />

    <!-- Compound Eyes (Vibrant Red) -->
    <circle cx="-4" cy="-3" r="3.5" fill="#ef4444" />
    <circle cx="-5" cy="-4" r="1.2" fill="#ffffff" />

    <circle cx="4" cy="-3" r="3.5" fill="#ef4444" />
    <circle cx="3" cy="-4" r="1.2" fill="#ffffff" />

    <!-- Tiny Legs -->
    <line x1="-5" y1="6" x2="-8" y2="10" stroke="#0f172a" stroke-width="1.2" />
    <line x1="0" y1="7" x2="0" y2="11" stroke="#0f172a" stroke-width="1.2" />
    <line x1="5" y1="6" x2="8" y2="10" stroke="#0f172a" stroke-width="1.2" />
  </g>

</svg>
